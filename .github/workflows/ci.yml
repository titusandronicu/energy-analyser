name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: |
          npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          npx supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Build and run the Node server
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" ALLOW_SIGNUP=true npm run build
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" ALLOW_SIGNUP=true APP_VERSION="$GITHUB_SHA" HOST=127.0.0.1 PORT=4321 node ./dist/server/entry.mjs &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4321/api/health && break; sleep 1; done
          BASE_URL=http://127.0.0.1:4321 npm run smoke
      - if: always()
        run: npx supabase stop --no-backup
