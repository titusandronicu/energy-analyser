name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npx astro check
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/local-supabase
      - name: Build and run the Node server
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" ALLOW_SIGNUP=true npm run build
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" ALLOW_SIGNUP=true APP_VERSION="$GITHUB_SHA" HOST=127.0.0.1 PORT=4321 node ./dist/server/entry.mjs &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4321/api/health && break; sleep 1; done
          BASE_URL=http://127.0.0.1:4321 MAILPIT_URL=http://127.0.0.1:54324 SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" npm run smoke
      - if: always()
        run: npx supabase stop --no-backup

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/local-supabase
      - name: Run the integration tests
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" npm run test:integration
      - if: always()
        run: npx supabase stop --no-backup

  # Browser e2e (Playwright, Chromium). Not a required check: the ruleset still requires only ci, smoke and integration.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/local-supabase
      - name: Run the browser tests
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - if: always()
        run: npx supabase stop --no-backup
