# Alert rules: run the evaluator once by hand (workflow_dispatch only). POSTs to the app's evaluate route, which checks the
# owner's rules and sends Telegram messages itself (docs/prerequisites.md, "One-time production steps (app)";
# docs/logic.md, "Alert rules").
# There is deliberately no schedule here. The regular trigger is the `alerts-trigger` compose service on the production
# host (compose.yaml, scripts/alerts-trigger.mjs): GitHub's scheduler started this workflow hours late or not at all,
# and a second automatic trigger beside the service could send a message twice (docs/decisions.md, 2026-10-06 "alert
# trigger"). A non-2xx answer (route down, 401 bad token, 503 Telegram not configured) fails the run, so it shows red.
# No third-party action: one curl, with the token passed through the environment and never printed.
name: Alerts evaluate

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: alerts-evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate alert rules
        env:
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
          ALERTS_BASE_URL: ${{ vars.ALERTS_BASE_URL }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer $ALERTS_TOKEN" \
            "$ALERTS_BASE_URL/api/alerts/evaluate"
